[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/mark-it-done"
  to = "https://mark-it-done-600.netlify.app/"
  status = 200
  force = true

[[redirects]]
  from = "/mark-it-done/*"
  to = "https://mark-it-done-600.netlify.app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/scannow/*"
  to = "https://scannow-100.netlify.app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/scannow"
  to = "/scannow/"
  status = 301
  force = true

[[redirects]]
  from = "/letswander/*"
  to = "https://letswander-app.netlify.app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/letswander"
  to = "/letswander/"
  status = 301
  force = true

[[redirects]]
  from = "/invoicing/*"
  to = "https://invoice-estimate-builder.netlify.app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/invoicing"
  to = "/invoicing/"
  status = 301
  force = true

[[redirects]]
  from = "/answersoffaith/*"
  to = "https://answers-of-faith.netlify.app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/answersoffaith"
  to = "/answersoffaith/"
  status = 301
  force = true

# GasPicker is a full app with its own serverless functions on www.gaspicker.com.
# Proxying its pages here (status 200) served the app from 40thfloor.com, where
# its /.netlify/functions/* calls 404'd — so we REDIRECT to the real origin
# instead of proxying, so the backend calls resolve.
[[redirects]]
  from = "/gaspicker/*"
  to = "https://www.gaspicker.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/gaspicker"
  to = "https://www.gaspicker.com/"
  status = 301
  force = true

[[redirects]]
  from = "/fuelstop/*"
  to = "/gaspicker/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/fuelstop"
  to = "/gaspicker/"
  status = 301
  force = true

# Minudex (formerly The Case File) is a Vite SPA at https://minudex.com
# (Netlify site casefile-40th). A status-200 proxy under /casefile/ returned
# that app's index.html, whose script and stylesheet are root-relative
# (/assets/...). The browser then requested those files from 40thfloor.com,
# where they 404, so the page stayed blank. Redirect old links to the real site.
# Exact paths come before the splat (first match wins).
[[redirects]]
  from = "/casefile"
  to = "https://minudex.com/"
  status = 301
  force = true

[[redirects]]
  from = "/casefile/"
  to = "https://minudex.com/"
  status = 301
  force = true

[[redirects]]
  from = "/casefile/*"
  to = "https://minudex.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/glow/*"
  to = "https://glow-owosso.netlify.app/glow/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/glow"
  to = "/glow/"
  status = 301
  force = true

# Event Hub is a Next.js app with basePath /eventhub, deployed at
# https://event-hub-40thfloor.netlify.app/eventhub
# The app returns 200 for /eventhub and 308s /eventhub/ to /eventhub.
# Do not 301 /eventhub to /eventhub/ — that pair is a redirect loop.
# Exact paths come before the splat (first match wins). /eventhub/ is
# proxied to the no-slash origin URL; sending it to .../eventhub/ makes
# the app 308 back to /eventhub and the browser loops. The splat still
# covers subpaths, including /eventhub/_next assets.
# force = true matches the other proxies so these rules win over any
# broader rule.
[[redirects]]
  from = "/eventhub"
  to = "https://event-hub-40thfloor.netlify.app/eventhub"
  status = 200
  force = true

[[redirects]]
  from = "/eventhub/"
  to = "https://event-hub-40thfloor.netlify.app/eventhub"
  status = 200
  force = true

[[redirects]]
  from = "/eventhub/*"
  to = "https://event-hub-40thfloor.netlify.app/eventhub/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
