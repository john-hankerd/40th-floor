[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/mark-it-done"
  to = "https://mark-it-done-600.netlify.app/"
  status = 200
  force = true

[[redirects]]
  from = "/mark-it-done/*"
  to = "https://mark-it-done-600.netlify.app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/scannow/*"
  to = "https://scannow-100.netlify.app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/scannow"
  to = "/scannow/"
  status = 301
  force = true

[[redirects]]
  from = "/letswander/*"
  to = "https://letswander-app.netlify.app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/letswander"
  to = "/letswander/"
  status = 301
  force = true

[[redirects]]
  from = "/invoicing/*"
  to = "https://invoice-estimate-builder.netlify.app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/invoicing"
  to = "/invoicing/"
  status = 301
  force = true

[[redirects]]
  from = "/answersoffaith/*"
  to = "https://answers-of-faith.netlify.app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/answersoffaith"
  to = "/answersoffaith/"
  status = 301
  force = true

# GasPicker is a full app with its own serverless functions on www.gaspicker.com.
# Proxying its pages here (status 200) served the app from 40thfloor.com, where
# its /.netlify/functions/* calls 404'd — so we REDIRECT to the real origin
# instead of proxying, so the backend calls resolve.
[[redirects]]
  from = "/gaspicker/*"
  to = "https://www.gaspicker.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/gaspicker"
  to = "https://www.gaspicker.com/"
  status = 301
  force = true

[[redirects]]
  from = "/fuelstop/*"
  to = "/gaspicker/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/fuelstop"
  to = "/gaspicker/"
  status = 301
  force = true

# The Case File — true-crime companion app (React/Vite SPA on its own Netlify
# site, base path /casefile/). Wildcard proxy first, then the trailing-slash
# redirect (order matters — see the scannow pattern).
[[redirects]]
  from = "/casefile/*"
  to = "https://casefile-40th.netlify.app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/casefile"
  to = "/casefile/"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
