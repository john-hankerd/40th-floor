<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Wooden Crate Popcorn Sort</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Stardos+Stencil:wght@700&family=Montserrat:wght@500&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: one screen. Black name bar, pale wood title plaque, cups on barnwood, wood buttons, espresso footer. */
  --night: #3a3028;        /* weathered barnwood */
  --night-deep: #221b15;
  --cream: #f1e4c8;
  --wood: #e6d3ab;         /* pale popcorn-box wood */
  --ink: #3b2a20;          /* stencil brown */
  --espresso: #3f2d1e;     /* site footer brown */
  --butter: #f2bd4b;       /* picked-cup highlight */
  --muted: #cbbda3;
  --font-display: "Stardos Stencil", "Rockwell", "Courier New", serif;
  --font-caps: "Montserrat", "Avenir Next", "Segoe UI", sans-serif;
  --font-body: "Nunito", "Trebuchet MS", "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: repeating-linear-gradient(0deg, rgba(0,0,0,0.3) 0 2px, rgba(255,255,255,0.03) 2px 3px, transparent 3px 46px), linear-gradient(180deg, #4a3f35 0%, var(--night) 40%, var(--night-deep) 100%) var(--night);
  color: var(--cream);
  font-family: var(--font-body);
  font-weight: 600;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}
.bar {
  background: #000;
  color: #fff;
  font-family: var(--font-caps);
  font-weight: 500;
  font-size: clamp(11px, 3.4vw, 14px);
  letter-spacing: 0.3em;
  text-transform: uppercase;
  text-align: center;
  padding: 9px 12px;
  white-space: nowrap;
}
header {
  padding: 10px 16px 6px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}
h1 {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(24px, 7.4vw, 36px);
  line-height: 1;
  margin: 0;
  padding: 9px 20px 6px;
  color: var(--ink);
  letter-spacing: 0.03em;
  text-transform: uppercase;
  text-align: center;
  background: linear-gradient(180deg, #efdfbb 0%, var(--wood) 55%, #d8c292 100%);
  border-radius: 6px;
  box-shadow: 0 3px 10px rgba(0, 0, 0, 0.45), inset 0 -2px 0 rgba(90, 60, 30, 0.25);
}
.sub {
  margin: 0;
  font-family: var(--font-caps);
  font-size: 11px;
  font-weight: 500;
  color: var(--muted);
  letter-spacing: 0.28em;
  text-transform: uppercase;
}
.stats {
  display: flex;
  gap: 18px;
  font-size: 15px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.stats b { color: var(--cream); font-weight: 800; }
#status {
  min-height: 22px;
  margin: 0;
  padding: 0 16px;
  text-align: center;
  font-size: 15px;
  color: var(--cream);
}
#stage {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
  margin: 4px 16px;
}
canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: manipulation;
  outline: none;
}
canvas:focus-visible { outline: 2px dashed var(--butter); outline-offset: 2px; border-radius: 8px; }
.controls {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  padding: 8px 16px 8px;
  max-width: 560px;
  width: 100%;
  margin: 0 auto;
}
button {
  font: inherit;
  font-weight: 800;
  font-size: 14px;
  min-height: 46px;
  padding: 6px 4px;
  color: var(--ink);
  background: linear-gradient(180deg, #efdfbb, #dcc797);
  border: 2px solid #a88d5c;
  border-radius: 8px;
  cursor: pointer;
}
button:active { transform: translateY(1px); background: #d2bb88; }
button:disabled { opacity: 0.45; cursor: default; }
button:focus-visible { outline: 3px solid var(--butter); outline-offset: 2px; }
.shop {
  margin: 0;
  padding: 10px 16px 14px;
  text-align: center;
  font-size: 14px;
  line-height: 1.4;
  color: var(--cream);
  background: var(--espresso);
}
.shop span {
  display: block;
  font-family: var(--font-caps);
  font-weight: 500;
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
}
.shop a { color: #fff; font-weight: 800; }
.shop a:focus-visible { outline: 3px solid var(--butter); outline-offset: 2px; }
#win {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(24, 14, 6, 0.75);
}
#win[hidden] { display: none; }
.card {
  background: var(--wood);
  color: var(--ink);
  border-radius: 16px;
  padding: 22px 24px;
  text-align: center;
  max-width: 300px;
  border-top: 12px solid var(--espresso);
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
}
.card h2 {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 30px;
  margin: 0 0 6px;
  text-transform: uppercase;
  color: var(--ink);
}
.card p { margin: 0 0 16px; font-size: 16px; }
.card button {
  width: 100%;
  color: #fff;
  background: #000;
  border-color: #000;
  font-size: 17px;
}
</style>
</head>
<body>
<div class="bar">Wooden Crate Popcorn Co</div>
<header>
  <h1>Popcorn Sort</h1>
  <p class="sub">Owosso, Michigan</p>
  <div class="stats">
    <span>Level <b id="level">1</b></span>
    <span><b id="flavors">3</b> flavors</span>
    <span>Moves <b id="moves">0</b></span>
  </div>
</header>
<p id="status" aria-live="polite">Tap a cup. Then tap the cup you want to pour into.</p>
<div id="stage">
  <canvas id="game" tabindex="0" aria-label="Popcorn cups. Tap a cup to pick it up, then tap another cup to pour. You can also press number keys to pick cups."></canvas>
  <div id="win" hidden>
    <div class="card">
      <h2>All sorted!</h2>
      <p id="winText"></p>
      <button id="next" type="button">Next level</button>
    </div>
  </div>
</div>
<div class="controls">
  <button id="undo" type="button">Undo</button>
  <button id="restart" type="button">Restart</button>
  <button id="addcup" type="button">Add cup</button>
  <button id="newmix" type="button">New mix</button>
</div>
<p class="shop"><span>Unique creations for unique occasions.</span>Shop at <a href="https://woodencratepopcorn.com/" target="_blank" rel="noopener">woodencratepopcorn.com</a></p>

<script>
(function () {
  "use strict";

  var CAP = 4;
  var FLAVORS = [
    { name: "Cheese, Please!", color: "#f28a1c" },
    { name: "White Cheddar", color: "#f6f0e0" },
    { name: "Dark Chocolate Toffee Crunch", color: "#5e3826" },
    { name: "Blue", color: "#3a8fe8" },
    { name: "Buttery Caramel", color: "#b9772c" },
    { name: "Red", color: "#e23b4e" },
    { name: "Green", color: "#6cc24a" },
    { name: "Purple", color: "#9160dc" },
    { name: "Pink", color: "#f79fca" }
  ];
  var VARIANTS = 4;

  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");
  var stage = document.getElementById("stage");
  var elLevel = document.getElementById("level");
  var elFlavors = document.getElementById("flavors");
  var elMoves = document.getElementById("moves");
  var elStatus = document.getElementById("status");
  var elWin = document.getElementById("win");
  var elWinText = document.getElementById("winText");
  var btnUndo = document.getElementById("undo");
  var btnRestart = document.getElementById("restart");
  var btnAdd = document.getElementById("addcup");
  var btnNew = document.getElementById("newmix");
  var btnNext = document.getElementById("next");

  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ---------- game state ----------
  var level = 1;
  var tubes = [];
  var startTubes = [];
  var moves = 0;
  var history = [];
  var extraUsed = false;
  var sel = -1;
  var won = false;
  var flying = [];      // popcorn in the air
  var shake = null;     // { tube, t0 }

  function loadLevel() {
    try {
      var v = parseInt(localStorage.getItem("popcornSortLevel"), 10);
      if (v > 0) level = v;
    } catch (e) {}
  }
  function saveLevel() {
    try { localStorage.setItem("popcornSortLevel", String(level)); } catch (e) {}
  }

  function flavorCount(lv) { return Math.min(3 + Math.floor((lv - 1) / 2), FLAVORS.length); }

  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function isComplete(a) {
    if (a.length !== CAP) return false;
    for (var i = 1; i < CAP; i++) if (a[i] !== a[0]) return false;
    return true;
  }
  function allDone(t) {
    for (var i = 0; i < t.length; i++) if (t[i].length && !isComplete(t[i])) return false;
    return true;
  }
  function topRun(a) {
    var n = 0;
    for (var i = a.length - 1; i >= 0 && a[i] === a[a.length - 1]; i--) n++;
    return n;
  }
  function canPour(a, b) {
    if (!a.length || b.length >= CAP) return false;
    return b.length === 0 || b[b.length - 1] === a[a.length - 1];
  }

  // Checks that a mix can be solved, so you never get an impossible level.
  function solvable(start) {
    var seen = new Set();
    var nodes = 0;
    function key(t) {
      return t.map(function (a) { return a.join(""); }).sort().join("|");
    }
    function rec(t, depth) {
      if (allDone(t)) return true;
      if (++nodes > 20000 || depth > 300) return false;
      var k = key(t);
      if (seen.has(k)) return false;
      seen.add(k);
      for (var i = 0; i < t.length; i++) {
        var a = t[i];
        if (!a.length || isComplete(a)) continue;
        var run = topRun(a);
        var triedEmpty = false;
        for (var j = 0; j < t.length; j++) {
          if (i === j) continue;
          var b = t[j];
          if (!canPour(a, b)) continue;
          if (b.length === 0) {
            if (run === a.length || triedEmpty) continue;
            triedEmpty = true;
          }
          var n = Math.min(run, CAP - b.length);
          var nt = t.map(function (x) { return x.slice(); });
          for (var m = 0; m < n; m++) nt[j].push(nt[i].pop());
          if (rec(nt, depth + 1)) return true;
        }
      }
      return false;
    }
    return rec(start, 0);
  }

  function makeMix(nc) {
    var best = null;
    for (var attempt = 0; attempt < 25; attempt++) {
      var pool = [];
      for (var c = 0; c < nc; c++) for (var k = 0; k < CAP; k++) pool.push(c);
      shuffle(pool);
      var t = [];
      for (var i = 0; i < nc; i++) t.push(pool.slice(i * CAP, i * CAP + CAP));
      t.push([]); t.push([]);
      var anyDone = t.some(isComplete);
      best = t;
      if (!anyDone && solvable(t)) return t;
    }
    return best;
  }

  function clone(t) { return t.map(function (a) { return a.slice(); }); }

  function newGame(freshMix) {
    var nc = flavorCount(level);
    if (freshMix || !startTubes.length) startTubes = makeMix(nc);
    tubes = clone(startTubes);
    moves = 0;
    history = [];
    extraUsed = false;
    sel = -1;
    won = false;
    flying = [];
    shake = null;
    elWin.hidden = true;
    setStatus("Tap a cup. Then tap the cup you want to pour into.");
    updateHud();
    layout();
    kick();
  }

  function updateHud() {
    elLevel.textContent = level;
    elFlavors.textContent = flavorCount(level);
    elMoves.textContent = moves;
    btnUndo.disabled = !history.length || won;
    btnAdd.disabled = extraUsed || won;
  }
  function setStatus(s) { elStatus.textContent = s; }

  function hasMoves() {
    for (var i = 0; i < tubes.length; i++) {
      var a = tubes[i];
      if (!a.length || isComplete(a)) continue;
      for (var j = 0; j < tubes.length; j++) {
        if (i === j || !canPour(a, tubes[j])) continue;
        if (tubes[j].length === 0 && topRun(a) === a.length) continue;
        return true;
      }
    }
    return false;
  }

  // ---------- layout ----------
  var W = 0, H = 0, dpr = 1;
  var G = { tw: 50, unit: 40, th: 180, pos: [] };
  var sprites = [];

  function layout() {
    var r = stage.getBoundingClientRect();
    W = Math.max(200, r.width);
    H = Math.max(200, r.height);
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);

    var n = tubes.length;
    var rows = n <= 5 ? 1 : 2;
    var perRow = Math.ceil(n / rows);
    var slotW = W / perRow;
    var tw = Math.min(64, slotW * 0.72);
    function rowHeight(w) { return w * 0.78 * CAP + w * 0.3 + 20 + 14 + 24; }
    var need = rows * rowHeight(tw);
    if (need > H) tw *= H / need;
    tw = Math.max(26, tw);
    var unit = tw * 0.78;
    var th = unit * CAP + tw * 0.3;
    var rowH = rowHeight(tw);
    var step = Math.min(slotW, tw * 1.55);
    var top0 = (H - rows * rowH) / 2 + 26;

    var pos = [];
    for (var i = 0; i < n; i++) {
      var row = Math.floor(i / perRow);
      var inRow = row === rows - 1 ? n - perRow * (rows - 1) : perRow;
      var col = i - row * perRow;
      var cx = W / 2 + (col - (inRow - 1) / 2) * step;
      pos.push({ x: cx - tw / 2, y: top0 + row * rowH, cx: cx });
    }
    var changed = Math.abs(G.tw - tw) > 0.01 || !sprites.length || G.dpr !== dpr;
    G = { tw: tw, unit: unit, th: th, pos: pos, dpr: dpr };
    if (changed) buildSprites();
  }

  function slotY(ti, j) {
    var p = G.pos[ti];
    return p.y + G.th - G.tw * 0.1 - G.unit * (j + 0.5);
  }

  // ---------- popcorn art ----------
  function rng(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function mix(hex, to, amt) {
    var a = [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
    var out = a.map(function (v, i) { return Math.round(v + (to[i] - v) * amt); });
    return "rgb(" + out.join(",") + ")";
  }

  function drawKernel(c, x, y, r, color, rand) {
    var dark = mix(color, [20, 10, 6], 0.6);
    var shade = mix(color, [60, 30, 20], 0.22);
    var light = mix(color, [255, 255, 255], 0.55);
    var blobs = [];
    var count = 4 + Math.floor(rand() * 2);
    for (var i = 0; i < count; i++) {
      var ang = (i / count) * Math.PI * 2 + rand() * 0.8;
      var d = r * (0.3 + rand() * 0.22);
      blobs.push({ x: x + Math.cos(ang) * d, y: y + Math.sin(ang) * d, r: r * (0.5 + rand() * 0.14) });
    }
    blobs.push({ x: x, y: y, r: r * 0.55 });
    var i2;
    c.fillStyle = dark;
    for (i2 = 0; i2 < blobs.length; i2++) circle(c, blobs[i2].x, blobs[i2].y, blobs[i2].r + Math.max(1, r * 0.1));
    c.fillStyle = shade;
    for (i2 = 0; i2 < blobs.length; i2++) circle(c, blobs[i2].x, blobs[i2].y, blobs[i2].r);
    c.fillStyle = color;
    for (i2 = 0; i2 < blobs.length; i2++) circle(c, blobs[i2].x - r * 0.06, blobs[i2].y - r * 0.1, blobs[i2].r * 0.86);
    c.fillStyle = light;
    for (i2 = 0; i2 < blobs.length; i2 += 2) circle(c, blobs[i2].x - blobs[i2].r * 0.3, blobs[i2].y - blobs[i2].r * 0.35, blobs[i2].r * 0.3);
  }
  function circle(c, x, y, r) {
    c.beginPath();
    c.arc(x, y, r, 0, Math.PI * 2);
    c.fill();
  }

  function buildSprites() {
    sprites = [];
    var sw = G.tw + 8, sh = G.unit + 12;
    for (var f = 0; f < FLAVORS.length; f++) {
      var set = [];
      for (var v = 0; v < VARIANTS; v++) {
        var cv = document.createElement("canvas");
        cv.width = Math.ceil(sw * dpr);
        cv.height = Math.ceil(sh * dpr);
        var c = cv.getContext("2d");
        c.scale(dpr, dpr);
        var rand = rng(f * 97 + v * 13 + 5);
        var r = G.unit * 0.31;
        var spots = [[0.2, 0.66], [0.5, 0.7], [0.8, 0.66], [0.34, 0.36], [0.67, 0.34]];
        for (var s = 0; s < spots.length; s++) {
          var kx = sw * spots[s][0] + (rand() - 0.5) * r * 0.4;
          var ky = sh * spots[s][1] + (rand() - 0.5) * r * 0.3;
          drawKernel(c, kx, ky, r, FLAVORS[f].color, rand);
        }
        set.push(cv);
      }
      sprites.push(set);
    }
  }

  function drawUnit(colorIdx, variant, cx, cy) {
    var sw = G.tw + 8, sh = G.unit + 12;
    ctx.drawImage(sprites[colorIdx][variant % VARIANTS], cx - sw / 2, cy - sh / 2, sw, sh);
  }

  function cupPath(x, y, w, h, topExtra) {
    var r = w * 0.4;
    ctx.beginPath();
    ctx.moveTo(x, y - topExtra);
    ctx.lineTo(x, y + h - r);
    ctx.quadraticCurveTo(x, y + h, x + r, y + h);
    ctx.lineTo(x + w - r, y + h);
    ctx.quadraticCurveTo(x + w, y + h, x + w, y + h - r);
    ctx.lineTo(x + w, y - topExtra);
  }

  function stripes(x, y, w, h) {
    var n = Math.max(4, Math.round(w / 7));
    var sw = w / n;
    for (var i = 0; i < n; i++) {
      ctx.fillStyle = i % 2 ? "#ead8b2" : "#d9c493";
      ctx.fillRect(x + i * sw, y, sw + 0.5, h);
    }
  }

  function draw(now) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);

    var hidden = {};
    for (var f = 0; f < flying.length; f++) hidden[flying[f].to + ":" + flying[f].toSlot] = true;

    for (var i = 0; i < tubes.length; i++) {
      var p = G.pos[i];
      if (!p) continue;
      var x = p.x, y = p.y, w = G.tw, h = G.th;
      if (i === sel) y -= 18;
      if (shake && shake.tube === i) {
        var k = (now - shake.t0) / 300;
        if (k >= 1) shake = null; else x += Math.sin(k * Math.PI * 6) * 5 * (1 - k);
      }
      var done = isComplete(tubes[i]) && !hidden[i + ":" + (CAP - 1)];
      var dy = y - p.y, dx = x - p.x;

      // foot
      ctx.save();
      ctx.beginPath();
      ctx.rect(x + w * 0.18, y + h + 3, w * 0.64, 7);
      ctx.clip();
      stripes(x + w * 0.18, y + h + 3, w * 0.64, 7);
      ctx.restore();

      // glass
      cupPath(x, y, w, h, 0);
      ctx.fillStyle = "rgba(18, 9, 3, 0.55)";
      ctx.fill();

      // popcorn
      ctx.save();
      cupPath(x, y, w, h, G.unit);
      ctx.closePath();
      ctx.clip();
      for (var j = 0; j < tubes[i].length; j++) {
        if (hidden[i + ":" + j]) continue;
        drawUnit(tubes[i][j], i * 3 + j, p.cx + dx, slotY(i, j) + dy);
      }
      ctx.restore();

      // outline and rim
      cupPath(x, y, w, h, 0);
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = i === sel || done ? "#f2bd4b" : "rgba(243, 227, 192, 0.8)";
      ctx.lineJoin = "round";
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x - 3, y);
      ctx.lineTo(x + w + 3, y);
      ctx.lineCap = "round";
      ctx.lineWidth = 3.5;
      ctx.stroke();

      // shine
      ctx.beginPath();
      ctx.moveTo(x + w * 0.16, y + h * 0.1);
      ctx.lineTo(x + w * 0.16, y + h * 0.62);
      ctx.strokeStyle = "rgba(255, 255, 255, 0.22)";
      ctx.lineWidth = Math.max(2, w * 0.06);
      ctx.stroke();

      // lid on a finished cup
      if (done) {
        ctx.save();
        ctx.beginPath();
        ctx.rect(x - 5, y - 10, w + 10, 10);
        ctx.clip();
        stripes(x - 5, y - 10, w + 10, 10);
        ctx.restore();
        ctx.strokeStyle = "#f2bd4b";
        ctx.lineWidth = 2;
        ctx.strokeRect(x - 5, y - 10, w + 10, 10);
      }
    }

    // popcorn in the air
    var still = [];
    for (var q = 0; q < flying.length; q++) {
      var fl = flying[q];
      var t = (now - fl.t0) / fl.dur;
      if (t >= 1) continue;
      still.push(fl);
      if (t < 0) { drawUnit(fl.color, fl.variant, fl.x0, fl.y0); continue; }
      var e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      var u = 1 - e;
      var bx = u * u * fl.x0 + 2 * u * e * fl.cx + e * e * fl.x1;
      var by = u * u * fl.y0 + 2 * u * e * fl.cy + e * e * fl.y1;
      drawUnit(fl.color, fl.variant, bx, by);
    }
    var landed = flying.length && !still.length;
    flying = still;
    if (landed) afterMove();
  }

  var running = false;
  function kick() {
    if (running) return;
    running = true;
    requestAnimationFrame(tick);
  }
  function tick(now) {
    draw(now);
    if (flying.length || shake) requestAnimationFrame(tick);
    else { running = false; draw(now); }
  }

  // ---------- moves ----------
  function pour(from, to) {
    var a = tubes[from], b = tubes[to];
    if (!canPour(a, b)) return false;
    history.push({ tubes: clone(tubes), moves: moves, extraUsed: extraUsed });
    var n = Math.min(topRun(a), CAP - b.length);
    var now = performance.now();
    var pa = G.pos[from], pb = G.pos[to];
    for (var k = 0; k < n; k++) {
      var fromSlot = a.length - 1, toSlot = b.length;
      var color = a.pop();
      b.push(color);
      if (!reduceMotion) {
        flying.push({
          color: color, variant: to * 3 + toSlot, to: to, toSlot: toSlot,
          x0: pa.cx, y0: slotY(from, fromSlot),
          x1: pb.cx, y1: slotY(to, toSlot),
          cx: (pa.cx + pb.cx) / 2, cy: Math.min(pa.y, pb.y) - 46,
          t0: now + k * 80, dur: 330
        });
      }
    }
    moves++;
    updateHud();
    if (reduceMotion) afterMove();
    return true;
  }

  function afterMove() {
    if (allDone(tubes)) {
      won = true;
      updateHud();
      elWinText.textContent = "Level " + level + " took you " + moves + (moves === 1 ? " move." : " moves.");
      elWin.hidden = false;
      setStatus("Every flavor is in its own cup.");
      level++;
      saveLevel();
      btnNext.focus();
      return;
    }
    var last = history.length ? lastFinished() : null;
    if (last !== null) setStatus(FLAVORS[last].name + " is sorted. Nice.");
    else if (!hasMoves()) setStatus(extraUsed ? "No moves left. Try Undo or Restart." : "No moves left. Try Undo or Add cup.");
    else setStatus("Keep going. Match the top colors.");
  }

  function lastFinished() {
    var prev = history[history.length - 1].tubes;
    for (var i = 0; i < tubes.length; i++) {
      if (isComplete(tubes[i]) && !(prev[i] && isComplete(prev[i]))) return tubes[i][0];
    }
    return null;
  }

  function tap(i) {
    if (won || flying.length) return;
    if (i < 0 || i >= tubes.length) { sel = -1; kick(); return; }
    if (sel === -1) {
      if (tubes[i].length && !isComplete(tubes[i])) sel = i;
      else if (isComplete(tubes[i])) setStatus("That cup's done. Pick another one.");
    } else if (sel === i) {
      sel = -1;
    } else {
      var from = sel;
      sel = -1;
      if (!pour(from, i)) {
        shake = { tube: i, t0: performance.now() };
        if (tubes[i].length >= CAP) setStatus("That cup's full.");
        else setStatus("The top colors have to match.");
        if (tubes[i].length && !isComplete(tubes[i])) sel = i;
      }
    }
    kick();
  }

  function hit(px, py) {
    for (var i = 0; i < G.pos.length; i++) {
      var p = G.pos[i];
      var padX = G.tw * 0.25;
      if (px >= p.x - padX && px <= p.x + G.tw + padX && py >= p.y - 30 && py <= p.y + G.th + 18) return i;
    }
    return -1;
  }

  canvas.addEventListener("pointerdown", function (ev) {
    var r = canvas.getBoundingClientRect();
    tap(hit(ev.clientX - r.left, ev.clientY - r.top));
  });

  document.addEventListener("keydown", function (ev) {
    if (ev.target && ev.target.tagName === "BUTTON") return;
    if (ev.key >= "0" && ev.key <= "9") {
      var n = ev.key === "0" ? 9 : parseInt(ev.key, 10) - 1;
      if (n < tubes.length) tap(n);
    }
  });

  btnUndo.addEventListener("click", function () {
    if (!history.length || won || flying.length) return;
    var h = history.pop();
    tubes = h.tubes;
    moves = h.moves;
    extraUsed = h.extraUsed;
    sel = -1;
    setStatus("Took that one back.");
    updateHud();
    layout();
    kick();
  });
  btnRestart.addEventListener("click", function () { newGame(false); });
  btnNew.addEventListener("click", function () { newGame(true); });
  btnAdd.addEventListener("click", function () {
    if (extraUsed || won || flying.length) return;
    history.push({ tubes: clone(tubes), moves: moves, extraUsed: extraUsed });
    tubes.push([]);
    extraUsed = true;
    sel = -1;
    setStatus("One extra cup. You get one per level.");
    updateHud();
    layout();
    kick();
  });
  btnNext.addEventListener("click", function () { newGame(true); });

  if (window.ResizeObserver) {
    new ResizeObserver(function () { layout(); kick(); }).observe(stage);
  } else {
    window.addEventListener("resize", function () { layout(); kick(); });
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { layout(); kick(); });

  loadLevel();
  newGame(true);
})();
</script>
</body>
</html>
