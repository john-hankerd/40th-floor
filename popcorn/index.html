<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Wooden Crate Popcorn Sort</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Stardos+Stencil:wght@700&family=Montserrat:wght@500&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: one screen. Black name bar, pale wood title plaque, cups on barnwood (or the unlocked flavor's photo), wood buttons, espresso footer. */
  --night: #3a3028;        /* weathered barnwood */
  --night-deep: #221b15;
  --cream: #f1e4c8;
  --wood: #e6d3ab;         /* pale popcorn-box wood */
  --ink: #3b2a20;          /* stencil brown */
  --espresso: #3f2d1e;     /* site footer brown */
  --butter: #f2bd4b;       /* picked-cup highlight */
  --muted: #cbbda3;
  --font-display: "Stardos Stencil", "Rockwell", "Courier New", serif;
  --font-caps: "Montserrat", "Avenir Next", "Segoe UI", sans-serif;
  --font-body: "Nunito", "Trebuchet MS", "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: repeating-linear-gradient(0deg, rgba(0,0,0,0.3) 0 2px, rgba(255,255,255,0.03) 2px 3px, transparent 3px 46px), linear-gradient(180deg, #4a3f35 0%, var(--night) 40%, var(--night-deep) 100%) var(--night);
  color: var(--cream);
  font-family: var(--font-body);
  font-weight: 600;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}
body.has-flavor {
  background: linear-gradient(180deg, rgba(22, 13, 6, 0.74) 0%, rgba(22, 13, 6, 0.7) 45%, rgba(22, 13, 6, 0.84) 100%), var(--bg-photo) center / cover no-repeat var(--night-deep);
}
.bar {
  background: #000;
  color: #fff;
  font-family: var(--font-caps);
  font-weight: 500;
  font-size: clamp(11px, 3.4vw, 14px);
  letter-spacing: 0.3em;
  text-transform: uppercase;
  text-align: center;
  padding: 9px 12px;
  white-space: nowrap;
}
header {
  padding: 10px 16px 6px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}
h1 {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(24px, 7.4vw, 36px);
  line-height: 1;
  margin: 0;
  padding: 9px 20px 6px;
  color: var(--ink);
  letter-spacing: 0.03em;
  text-transform: uppercase;
  text-align: center;
  background: linear-gradient(180deg, #efdfbb 0%, var(--wood) 55%, #d8c292 100%);
  border-radius: 6px;
  box-shadow: 0 3px 10px rgba(0, 0, 0, 0.45), inset 0 -2px 0 rgba(90, 60, 30, 0.25);
}
.sub {
  margin: 0;
  font-family: var(--font-caps);
  font-size: 11px;
  font-weight: 500;
  color: var(--muted);
  letter-spacing: 0.28em;
  text-transform: uppercase;
}
.stats {
  display: flex;
  gap: 18px;
  font-size: 15px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.stats b { color: var(--cream); font-weight: 800; }
#status {
  min-height: 22px;
  margin: 0;
  padding: 0 16px;
  text-align: center;
  font-size: 15px;
  color: var(--cream);
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7);
}
#stage {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
  margin: 4px 16px;
}
#game {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: manipulation;
  outline: none;
}
#game:focus-visible { outline: 2px dashed var(--butter); outline-offset: 2px; border-radius: 8px; }
#flavor {
  margin: 0 auto 2px;
  padding: 5px 16px 3px;
  text-align: center;
  color: var(--ink);
  background: linear-gradient(180deg, #efdfbb, #dcc797);
  border-radius: 5px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
  max-width: calc(100% - 32px);
}
#flavor[hidden] { display: none; }
#flavor span {
  display: block;
  font-family: var(--font-caps);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.26em;
  text-transform: uppercase;
}
#flavor b {
  font-family: var(--font-display);
  font-size: clamp(17px, 5.2vw, 22px);
  text-transform: uppercase;
  letter-spacing: 0.03em;
}
.controls {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  padding: 8px 16px 8px;
  max-width: 560px;
  width: 100%;
  margin: 0 auto;
}
button {
  font: inherit;
  font-weight: 800;
  font-size: 14px;
  min-height: 46px;
  padding: 6px 4px;
  color: var(--ink);
  background: linear-gradient(180deg, #efdfbb, #dcc797);
  border: 2px solid #a88d5c;
  border-radius: 8px;
  cursor: pointer;
}
button:active { transform: translateY(1px); background: #d2bb88; }
button:disabled { opacity: 0.45; cursor: default; }
button:focus-visible { outline: 3px solid var(--butter); outline-offset: 2px; }
.shop {
  margin: 0;
  padding: 10px 16px 14px;
  text-align: center;
  font-size: 14px;
  line-height: 1.4;
  color: var(--cream);
  background: var(--espresso);
}
.shop span {
  display: block;
  font-family: var(--font-caps);
  font-weight: 500;
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
}
.shop a { color: #fff; font-weight: 800; }
.shop a:focus-visible { outline: 3px solid var(--butter); outline-offset: 2px; }
#win {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(24, 14, 6, 0.75);
}
#win[hidden] { display: none; }
.card {
  background: var(--wood);
  color: var(--ink);
  border-radius: 16px;
  padding: 22px 24px;
  text-align: center;
  max-width: 300px;
  border-top: 12px solid var(--espresso);
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
}
.card h2 {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 30px;
  margin: 0 0 6px;
  text-transform: uppercase;
  color: var(--ink);
}
.card p { margin: 0 0 16px; font-size: 16px; }
.card button, .u-btn {
  width: 100%;
  color: #fff;
  background: #000;
  border-color: #000;
  font-size: 17px;
}

/* New flavor reveal */
#unlock {
  position: fixed;
  inset: 0;
  z-index: 10;
  background: rgba(14, 8, 3, 0.82);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  cursor: pointer;
}
#unlock[hidden] { display: none; }
#unlock.revealed { background: rgba(14, 8, 3, 0.55); cursor: default; }
#fx {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}
.u-box {
  position: relative;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 18px;
  max-width: 420px;
}
.u-box[hidden] { display: none; }
.u-big {
  margin: 0;
  font-family: var(--font-display);
  font-size: clamp(54px, 17vw, 92px);
  line-height: 0.95;
  text-transform: uppercase;
  color: var(--cream);
  text-shadow: 0 4px 0 #000, 0 0 34px rgba(242, 189, 75, 0.55);
  animation: thump 1.1s ease-in-out infinite;
}
.u-tap {
  margin: 0;
  font-family: var(--font-caps);
  font-size: 14px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--butter);
}
.u-small {
  margin: 0;
  font-family: var(--font-caps);
  font-size: 13px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: #fff;
  text-shadow: 0 2px 6px #000;
}
.u-name {
  margin: 0;
  padding: 16px 22px 10px;
  font-family: var(--font-display);
  font-size: clamp(34px, 10.5vw, 58px);
  line-height: 1;
  text-transform: uppercase;
  text-wrap: balance;
  color: var(--ink);
  background: linear-gradient(180deg, #f3e4c2, #dcc797);
  border-radius: 10px;
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
  animation: popin 0.5s cubic-bezier(0.2, 1.5, 0.4, 1) both;
}
.u-btn { width: auto; min-width: 220px; padding: 10px 22px; }
@keyframes thump { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
@keyframes popin { from { transform: scale(0.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
  .u-big, .u-name { animation: none; }
}
</style>
</head>
<body>
<div class="bar">Wooden Crate Popcorn Co</div>
<header>
  <h1 id="title">Popcorn Sort</h1>
  <p class="sub">Owosso, Michigan</p>
  <div class="stats">
    <span>Level <b id="level">1</b></span>
    <span><b id="flavors">3</b> colors</span>
    <span>Moves <b id="moves">0</b></span>
  </div>
</header>
<p id="status" aria-live="polite">Popping the corn&hellip;</p>
<div id="stage">
  <canvas id="game" tabindex="0" aria-label="Popcorn cups. Tap a cup to pick it up, then tap another cup to pour. You can also press number keys to pick cups."></canvas>
  <div id="win" hidden>
    <div class="card">
      <h2>All sorted!</h2>
      <p id="winText"></p>
      <button id="next" type="button">Next level</button>
    </div>
  </div>
</div>
<p id="flavor" hidden><span>Now popping</span><b id="flavorName"></b></p>
<div class="controls">
  <button id="undo" type="button">Undo</button>
  <button id="restart" type="button">Restart</button>
  <button id="addcup" type="button">Add cup</button>
  <button id="newmix" type="button">New mix</button>
</div>
<p class="shop"><span>Unique creations for unique occasions.</span>Shop at <a href="https://woodencratepopcorn.com/" target="_blank" rel="noopener">woodencratepopcorn.com</a></p>

<div id="unlock" hidden>
  <canvas id="fx"></canvas>
  <div class="u-box" id="uStage1">
    <p class="u-big">New<br>Flavor<br>Unlocked</p>
    <p class="u-tap">Tap to see it</p>
  </div>
  <div class="u-box" id="uStage2" hidden>
    <p class="u-small">Now popping</p>
    <p class="u-name" id="uName"></p>
    <button class="u-btn" id="uPlay" type="button">Play</button>
  </div>
</div>

,[401,315],[366,344]],"color":"#a6748c"}],"flavors":[{"name":"Michigan Cherry","tx":"img/f-michigan-cherry-tx.jpg","bg":"img/f-michigan-cherry-bg.jpg","w":384,"h":384,"c":[[301,242],[310,74],[158,39],[194,235],[177,165],[103,330],[102,53],[287,328],[245,105],[99,176]]},{"name":"Green Apple","tx":"img/f-green-apple-tx.jpg","bg":"img/f-green-apple-bg.jpg","w":384,"h":384,"c":[[85,53],[221,220],[121,215],[43,217],[83,280],[246,321],[295,213],[155,114],[168,328],[332,313],[259,76],[297,275],[335,99]]},{"name":"Sea Salt Caramel","tx":"img/f-sea-salt-caramel-tx.jpg","bg":"img/f-sea-salt-caramel-bg.jpg","w":384,"h":384,"c":[[100,266],[330,172],[227,155],[228,302],[110,113],[151,253],[292,215],[175,141],[321,272],[100,186],[211,97],[175,201],[40,139],[296,85]]},{"name":"Blueberry Delight","tx":"img/f-blueberry-delight-tx.jpg","bg":"img/f-blueberry-delight-bg.jpg","w":384,"h":384,"c":[[85,211],[165,301],[251,245],[176,226],[293,341],[108,105],[175,159],[247,119]]},{"name":"Jalapeno Cheddar","tx":"img/f-jalapeno-cheddar-tx.jpg","bg":"img/f-jalapeno-cheddar-bg.jpg","w":384,"h":384,"c":[[161,209],[298,241],[253,344],[68,93],[43,283],[324,307],[316,149],[135,309],[129,147],[135,45],[215,232],[221,109],[254,174]]},{"name":"Caramel Apple","tx":"img/f-caramel-apple-tx.jpg","bg":"img/f-caramel-apple-bg.jpg","w":384,"h":384,"c":[[254,164],[110,218],[336,208],[92,338],[134,99],[344,85],[261,86],[66,163],[194,298],[177,166],[54,66]]},{"name":"Strawberry Lemonade","tx":"img/f-strawberry-lemonade-tx.jpg","bg":"img/f-strawberry-lemonade-bg.jpg","w":384,"h":384,"c":[[155,342],[155,264],[264,194],[55,97],[275,344],[334,251],[111,39],[77,200],[344,49],[181,160],[190,94]]},{"name":"Cheddar Dill","tx":"img/f-cheddar-dill-tx.jpg","bg":"img/f-cheddar-dill-bg.jpg","w":384,"h":384,"c":[[96,164],[294,244],[279,98],[100,243],[212,310],[192,116],[192,203],[183,39],[136,56],[324,170]]},{"name":"Cherry Chocolate Caramel","tx":"img/f-cherry-chocolate-caramel-tx.jpg","bg":"img/f-cherry-chocolate-caramel-bg.jpg","w":384,"h":384,"c":[[67,333],[96,286],[201,276],[268,236],[261,108],[325,252],[314,123],[166,150]]},{"name":"Mardi Gras","tx":"img/f-mardi-gras-tx.jpg","bg":"img/f-mardi-gras-bg.jpg","w":384,"h":384,"c":[[256,137],[265,329],[306,58],[175,82],[251,227],[144,158],[53,301],[67,94]]},{"name":"Cherry Vanilla","tx":"img/f-cherry-vanilla-tx.jpg","bg":"img/f-cherry-vanilla-bg.jpg","w":384,"h":384,"c":[[284,328],[67,157],[331,222],[54,238],[148,213],[155,72],[275,197],[218,52],[319,61],[116,334]]},{"name":"Caramel Snack Mix","tx":"img/f-caramel-snack-mix-tx.jpg","bg":"img/f-caramel-snack-mix-bg.jpg","w":384,"h":384,"c":[[41,339],[187,61],[131,191],[185,224],[237,260],[292,321],[126,254],[71,239],[59,143],[130,314],[324,230],[248,151],[305,122],[276,87]]},{"name":"Halloween Magic","tx":"img/f-halloween-magic-tx.jpg","bg":"img/f-halloween-magic-bg.jpg","w":384,"h":384,"c":[[230,102],[97,186],[276,334],[317,118],[145,327],[204,214],[283,260],[98,78]]},{"name":"Christmas Candy Corn","tx":"img/f-christmas-candy-corn-tx.jpg","bg":"img/f-christmas-candy-corn-bg.jpg","w":384,"h":384,"c":[[101,132],[89,39],[237,115],[232,49],[240,276],[100,246],[51,330],[217,212],[308,196],[307,141],[274,343],[190,165],[162,284],[325,338]]},{"name":"God Bless America Corn","tx":"img/f-god-bless-america-corn-tx.jpg","bg":"img/f-god-bless-america-corn-bg.jpg","w":384,"h":384,"c":[[336,321],[199,112],[175,64],[68,321],[92,187]]},{"name":"Hull-less Sea Salt Caramel","tx":"img/f-hull-less-sea-salt-caramel-tx.jpg","bg":"img/f-hull-less-sea-salt-caramel-bg.jpg","w":384,"h":384,"c":[[130,41],[130,249],[212,82],[264,257],[208,190],[282,135],[306,306],[180,344]]}]};

  // ---------- saved progress ----------
  function store(key, val) {
    try {
      if (val === undefined) return localStorage.getItem(key);
      localStorage.setItem(key, val);
    } catch (e) {}
    return null;
  }

  var level = 1;
  var flavorOrder = null;
  (function () {
    var v = parseInt(store("popcornSortLevel"), 10);
    if (v > 0) level = v;
    try {
      var o = JSON.parse(store("popcornSortFlavors"));
      if (o && o.length === FLAVORS.length) flavorOrder = o;
    } catch (e) {}
    if (!flavorOrder) {
      flavorOrder = shuffle(FLAVORS.map(function (f, i) { return i; }));
      store("popcornSortFlavors", JSON.stringify(flavorOrder));
    }
  })();
  function saveLevel() { store("popcornSortLevel", String(level)); }

  // Levels 1-10 have no flavor yet. Each ten after that gets the next one.
  function flavorForLevel(lv) {
    var n = Math.floor((lv - 1) / UNLOCK_EVERY);
    if (n < 1) return -1;
    return flavorOrder[(n - 1) % flavorOrder.length];
  }

  // ---------- images ----------
  function loadImg(src) {
    return new Promise(function (resolve) {
      var im = new Image();
      im.onload = function () { resolve(im); };
      im.onerror = function () { resolve(null); };
      im.src = src;
    });
  }
  var colorImgs = [];
  var flavorCache = {};
  function loadFlavor(idx) {
    if (!flavorCache[idx]) {
      var f = FLAVORS[idx];
      flavorCache[idx] = Promise.all([loadImg(f.tx), loadImg(f.bg)]).then(function (r) {
        return { tx: r[0], bg: r[1] };
      });
    }
    return flavorCache[idx];
  }
  function applyFlavor(idx) {
    if (idx < 0) {
      document.body.classList.remove("has-flavor");
      elFlavor.hidden = true;
      return;
    }
    elFlavorName.textContent = FLAVORS[idx].name;
    elFlavor.hidden = false;
    loadFlavor(idx).then(function (r) {
      if (!r.bg || flavorForLevel(level) !== idx) return;
      document.body.style.setProperty("--bg-photo", 'url("' + FLAVORS[idx].bg + '")');
      document.body.classList.add("has-flavor");
    });
    setTimeout(function () { if (tubes.length) { layout(); kick(); } }, 0);
  }

  // ---------- game state ----------
  var tubes = [];

  var moves = 0;

  var sel = -1;
  var won = false;
  var intro = false;

  var shake = null;     // { tube, t0 }

  function flavorCount(lv) { return Math.min(3 + Math.floor((lv - 1) / 2), COLORS.length); }

  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function isComplete(a) {
    if (a.length !== CAP) return false;
    for (var i = 1; i < CAP; i++) if (a[i] !== a[0]) return false;
    return true;
  }
  function allDone(t) {
    for (var i = 0; i < t.length; i++) if (t[i].length && !isComplete(t[i])) return false;
    return true;
  }
  function topRun(a) {
    var n = 0;
    for (var i = a.length - 1; i >= 0 && a[i] === a[a.length - 1]; i--) n++;
    return n;
  }
  function canPour(a, b) {
    if (!a.length || b.length >= CAP) return false;
    return b.length === 0 || b[b.length - 1] === a[a.length - 1];
  }

  // Checks that a mix can be solved, so you never get an impossible level.
  function solvable(start) {
    var seen = new Set();
    var nodes = 0;
    function key(t) {
      return t.map(function (a) { return a.join(""); }).sort().join("|");
    }
    function rec(t, depth) {
      if (allDone(t)) return true;
      if (++nodes > 20000 || depth > 300) return false;
      var k = key(t);
      if (seen.has(k)) return false;
      seen.add(k);
      for (var i = 0; i < t.length; i++) {
        var a = t[i];
        if (!a.length || isComplete(a)) continue;
        var run = topRun(a);
        var triedEmpty = false;
        for (var j = 0; j < t.length; j++) {
          if (i === j) continue;
          var b = t[j];
          if (!canPour(a, b)) continue;
          if (b.length === 0) {
            if (run === a.length || triedEmpty) continue;
            triedEmpty = true;
          }
          var n = Math.min(run, CAP - b.length);
          var nt = t.map(function (x) { return x.slice(); });
          for (var m = 0; m < n; m++) nt[j].push(nt[i].pop());
          if (rec(nt, depth + 1)) return true;
        }
      }
      return false;
    }
    return rec(start, 0);
  }

  function makeMix(nc) {
    var best = null;
    for (var attempt = 0; attempt < 25; attempt++) {
      var pool = [];
      for (var c = 0; c < nc; c++) for (var k = 0; k < CAP; k++) pool.push(c);
      shuffle(pool);
      var t = [];
      for (var i = 0; i < nc; i++) t.push(pool.slice(i * CAP, i * CAP + CAP));
      t.push([]); t.push([]);
      var anyDone = t.some(isComplete);
      best = t;
      if (!anyDone && solvable(t)) return t;
    }
    return best;
  }

  function clone(t) { return t.map(function (a) { return a.slice(); }); }

  function newGame(freshMix) {
    var nc = flavorCount(level);
    if (freshMix || !startTubes.length) startTubes = makeMix(nc);
    tubes = clone(startTubes);
    moves = 0;
    history = [];
    extraUsed = false;
    sel = -1;
    won = false;
    flying = [];
    shake = null;
    elWin.hidden = true;
    updateHud();
    layout();
    popIn();
    kick();
  }

  // Start of a level: the cups are empty, and the popcorn pops onto the screen and drops in.
  function popIn() {
    intro = false;
    if (reduceMotion) { setStatus(HINT); return; }
    var now = performance.now() + 250;
    for (var i = 0; i < tubes.length; i++) {
      var p = G.pos[i];
      for (var j = 0; j < tubes[i].length; j++) {
        var tp = now + j * 300 + Math.random() * 260;
        var x0 = W * (0.08 + Math.random() * 0.84);
        var y0 = H * (0.06 + Math.random() * 0.88);
        flying.push({
          color: tubes[i][j], variant: i * 3 + j, to: i, toSlot: j,
          x0: x0, y0: y0, x1: p.cx, y1: slotY(i, j),
          cx: p.cx * 0.75 + x0 * 0.25, cy: Math.min(p.y, y0) - 70,
          pop: true, tp: tp, t0: tp + 300, dur: 420,
          spin: (Math.random() - 0.5) * 7
        });
      }
    }
    if (flying.length) { intro = true; setStatus("Here it comes!"); }
    else setStatus(HINT);
  }

  function updateHud() {
    elLevel.textContent = level;
    elFlavors.textContent = flavorCount(level);
    elMoves.textContent = moves;
    btnUndo.disabled = !history.length || won;
    btnAdd.disabled = extraUsed || won;
  }
  function setStatus(s) { elStatus.textContent = s; }

  function hasMoves() {
    for (var i = 0; i < tubes.length; i++) {
      var a = tubes[i];
      if (!a.length || isComplete(a)) continue;
      for (var j = 0; j < tubes.length; j++) {
        if (i === j || !canPour(a, tubes[j])) continue;
        if (tubes[j].length === 0 && topRun(a) === a.length) continue;
        return true;
      }
    }
    return false;
  }

  // ---------- layout ----------
  var W = 0, H = 0, dpr = 1;
  var G = { tw: 50, unit: 40, th: 180, pos: [] };
  var layerSprites = [];
  var kernelSprites = [];

  function layout() {
    var r = stage.getBoundingClientRect();
    W = Math.max(200, r.width);
    H = Math.max(200, r.height);
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    var cw = Math.round(W * dpr), ch = Math.round(H * dpr);
    if (canvas.width !== cw || canvas.height !== ch) { canvas.width = cw; canvas.height = ch; }

    var n = tubes.length;
    var rows = n <= 5 ? 1 : 2;
    var perRow = Math.ceil(n / rows);
    var slotW = W / perRow;
    var tw = Math.min(64, slotW * 0.72);
    function rowHeight(w) { return w * 0.78 * CAP + w * 0.3 + 20 + 14 + 24; }
    var need = rows * rowHeight(tw);
    if (need > H) tw *= H / need;
    tw = Math.max(26, tw);
    var unit = tw * 0.78;
    var th = unit * CAP + tw * 0.3;
    var rowH = rowHeight(tw);
    var step = Math.min(slotW, tw * 1.55);
    var top0 = (H - rows * rowH) / 2 + 26;

    var pos = [];
    for (var i = 0; i < n; i++) {
      var row = Math.floor(i / perRow);
      var inRow = row === rows - 1 ? n - perRow * (rows - 1) : perRow;
      var col = i - row * perRow;
      var cx = W / 2 + (col - (inRow - 1) / 2) * step;
      pos.push({ x: cx - tw / 2, y: top0 + row * rowH, cx: cx });
    }
    var changed = Math.abs(G.tw - tw) > 0.01 || !layerSprites.length || G.dpr !== dpr;
    G = { tw: tw, unit: unit, th: th, pos: pos, dpr: dpr };
    if (changed) buildSprites();
  }

  function slotY(ti, j) {
    var p = G.pos[ti];
    return p.y + G.th - G.tw * 0.1 - G.unit * (j + 0.5);
  }

  // ---------- popcorn art, cut from the real photos ----------
  function rng(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function disc(c, x, y, r) {
    c.beginPath();
    c.arc(x, y, r, 0, Math.PI * 2);
    c.fill();
  }

  // One popcorn piece: a lumpy cut-out of the photo, centered on a real piece.
  function makeKernel(img, entry, center, px, seed) {
    var cv = document.createElement("canvas");
    cv.width = cv.height = Math.max(8, Math.ceil(px));
    var c = cv.getContext("2d");
    var rand = rng(seed);
    var s = cv.width, r = s * 0.5;
    c.fillStyle = "#fff";
    disc(c, r, r, r * 0.62);
    var n = 5 + Math.floor(rand() * 2);
    for (var i = 0; i < n; i++) {
      var ang = (i / n) * Math.PI * 2 + rand() * 0.9;
      var d = r * (0.36 + rand() * 0.16);
      disc(c, r + Math.cos(ang) * d, r + Math.sin(ang) * d, r * (0.36 + rand() * 0.12));
    }
    c.globalCompositeOperation = "source-in";
    if (img) {
      var side = PITCH * 1.3;
      var sx = Math.max(0, Math.min(entry.w - side, center[0] - side / 2));
      var sy = Math.max(0, Math.min(entry.h - side, center[1] - side / 2));
      c.drawImage(img, sx, sy, side, side, 0, 0, s, s);
    } else {
      c.fillStyle = entry.color || "#e8c36a";
      c.fillRect(0, 0, s, s);
    }
    c.globalCompositeOperation = "source-atop";
    var g = c.createRadialGradient(s * 0.42, s * 0.38, s * 0.14, s * 0.5, s * 0.5, s * 0.56);
    g.addColorStop(0, "rgba(0,0,0,0)");
    g.addColorStop(0.7, "rgba(0,0,0,0.1)");
    g.addColorStop(1, "rgba(0,0,0,0.5)");
    c.fillStyle = g;
    c.fillRect(0, 0, s, s);
    var hl = c.createRadialGradient(s * 0.36, s * 0.3, 0, s * 0.36, s * 0.3, s * 0.3);
    hl.addColorStop(0, "rgba(255,255,255,0.2)");
    hl.addColorStop(1, "rgba(255,255,255,0)");
    c.fillStyle = hl;
    c.fillRect(0, 0, s, s);
    return cv;
  }

  // One layer in a cup: a strip of the photo with bumpy top and bottom edges.
  function makeLayer(img, entry, wCss, hCss, bumpCss, seed) {
    var cv = document.createElement("canvas");
    cv.width = Math.ceil(wCss * dpr);
    cv.height = Math.ceil(hCss * dpr);
    var c = cv.getContext("2d");
    var rand = rng(seed);
    var w = cv.width, h = cv.height, b = bumpCss * dpr;
    c.fillStyle = "#fff";
    c.fillRect(0, b, w, h - 2 * b);
    var n = 4;
    for (var e = 0; e < 2; e++) {
      for (var i = 0; i < n; i++) {
        var x = w * ((i + 0.5) / n) + (rand() - 0.5) * w * 0.1;
        var rr = b * (0.75 + rand() * 0.3);
        disc(c, x, e ? h - b - rr * 0.1 : b + rr * 0.1, rr);
      }
    }
    c.globalCompositeOperation = "source-in";
    if (img) {
      var piece = G.unit * 0.56 * dpr;          // how big one popcorn piece looks in a cup
      var sw = w / piece * PITCH, sh = h / piece * PITCH;
      var k = Math.min(1, entry.w / sw, entry.h / sh);
      sw *= k; sh *= k;
      var sx = rand() * (entry.w - sw), sy = rand() * (entry.h - sh);
      c.drawImage(img, sx, sy, sw, sh, 0, 0, w, h);
    } else {
      c.fillStyle = entry.color || "#e8c36a";
      c.fillRect(0, 0, w, h);
    }
    c.globalCompositeOperation = "source-atop";
    var g = c.createLinearGradient(0, 0, w, 0);
    g.addColorStop(0, "rgba(0,0,0,0.42)");
    g.addColorStop(0.22, "rgba(0,0,0,0)");
    g.addColorStop(0.75, "rgba(0,0,0,0)");
    g.addColorStop(1, "rgba(0,0,0,0.36)");
    c.fillStyle = g;
    c.fillRect(0, 0, w, h);
    return cv;
  }

  function layerW() { return G.tw + 6; }
  function layerBump() { return G.unit * 0.2; }
  function layerH() { return G.unit + 2 * layerBump(); }
  function kernelSize() { return G.unit * 0.84; }

  function buildSprites() {
    layerSprites = [];
    kernelSprites = [];
    for (var f = 0; f < COLORS.length; f++) {
      var ls = [], ks = [], e = COLORS[f], img = colorImgs[f] || null;
      for (var v = 0; v < LAYER_VARIANTS; v++) ls.push(makeLayer(img, e, layerW(), layerH(), layerBump(), f * 101 + v * 17 + 3));
      for (var k = 0; k < KERNEL_VARIANTS; k++) ks.push(makeKernel(img, e, e.c[k % e.c.length], kernelSize() * dpr, f * 59 + k * 23 + 7));
      layerSprites.push(ls);
      kernelSprites.push(ks);
    }
  }

  function drawLayer(colorIdx, variant, cx, cy) {
    var w = layerW(), h = layerH();
    ctx.drawImage(layerSprites[colorIdx][variant % LAYER_VARIANTS], cx - w / 2, cy - h / 2, w, h);
  }

  // A loose clump of three pieces, used while popcorn is in the air.
  function drawClump(colorIdx, variant, x, y, scale, rot) {
    var ks = kernelSprites[colorIdx], s = kernelSize(), u = G.unit;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.scale(scale, scale);
    ctx.drawImage(ks[variant % KERNEL_VARIANTS], -u * 0.3 - s / 2, u * 0.12 - s / 2, s, s);
    ctx.drawImage(ks[(variant + 3) % KERNEL_VARIANTS], u * 0.3 - s / 2, u * 0.1 - s / 2, s, s);
    ctx.drawImage(ks[(variant + 5) % KERNEL_VARIANTS], -s / 2, -u * 0.2 - s / 2, s, s);
    ctx.restore();
  }

  function cupPath(x, y, w, h, topExtra) {
    var r = w * 0.4;
    ctx.beginPath();
    ctx.moveTo(x, y - topExtra);
    ctx.lineTo(x, y + h - r);
    ctx.quadraticCurveTo(x, y + h, x + r, y + h);
    ctx.lineTo(x + w - r, y + h);
    ctx.quadraticCurveTo(x + w, y + h, x + w, y + h - r);
    ctx.lineTo(x + w, y - topExtra);
  }

  function stripes(x, y, w, h) {
    var n = Math.max(4, Math.round(w / 7));
    var sw = w / n;
    for (var i = 0; i < n; i++) {
      ctx.fillStyle = i % 2 ? "#ead8b2" : "#d9c493";
      ctx.fillRect(x + i * sw, y, sw + 0.5, h);
    }
  }

  function backOut(t) {
    var c1 = 2.2, c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  }

  function draw(now) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);

    var hidden = {};
    for (var f = 0; f < flying.length; f++) hidden[flying[f].to + ":" + flying[f].toSlot] = true;

    for (var i = 0; i < tubes.length; i++) {
      var p = G.pos[i];
      if (!p) continue;
      var x = p.x, y = p.y, w = G.tw, h = G.th;
      if (i === sel) y -= 18;
      if (shake && shake.tube === i) {
        var k = (now - shake.t0) / 300;
        if (k >= 1) shake = null; else x += Math.sin(k * Math.PI * 6) * 5 * (1 - k);
      }
      var done = isComplete(tubes[i]) && !hidden[i + ":" + (CAP - 1)];
      var dy = y - p.y, dx = x - p.x;

      // foot
      ctx.save();
      ctx.beginPath();
      ctx.rect(x + w * 0.18, y + h + 3, w * 0.64, 7);
      ctx.clip();
      stripes(x + w * 0.18, y + h + 3, w * 0.64, 7);
      ctx.restore();

      // glass
      cupPath(x, y, w, h, 0);
      ctx.fillStyle = "rgba(14, 8, 3, 0.72)";
      ctx.fill();

      // popcorn
      ctx.save();
      cupPath(x, y, w, h, G.unit);
      ctx.closePath();
      ctx.clip();
      ctx.shadowColor = "rgba(0, 0, 0, 0.6)";
      ctx.shadowBlur = 4;
      for (var j = 0; j < tubes[i].length; j++) {
        if (hidden[i + ":" + j]) continue;
        drawLayer(tubes[i][j], i * 3 + j, p.cx + dx, slotY(i, j) + dy);
      }
      ctx.restore();

      // outline and rim
      cupPath(x, y, w, h, 0);
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = i === sel || done ? "#f2bd4b" : "rgba(243, 227, 192, 0.85)";
      ctx.lineJoin = "round";
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x - 3, y);
      ctx.lineTo(x + w + 3, y);
      ctx.lineCap = "round";
      ctx.lineWidth = 3.5;
      ctx.stroke();

      // shine
      ctx.beginPath();
      ctx.moveTo(x + w * 0.16, y + h * 0.1);
      ctx.lineTo(x + w * 0.16, y + h * 0.62);
      ctx.strokeStyle = "rgba(255, 255, 255, 0.2)";
      ctx.lineWidth = Math.max(2, w * 0.06);
      ctx.stroke();

      // lid on a finished cup
      if (done) {
        ctx.save();
        ctx.beginPath();
        ctx.rect(x - 5, y - 10, w + 10, 10);
        ctx.clip();
        stripes(x - 5, y - 10, w + 10, 10);
        ctx.restore();
        ctx.strokeStyle = "#f2bd4b";
        ctx.lineWidth = 2;
        ctx.strokeRect(x - 5, y - 10, w + 10, 10);
      }
    }

    // popcorn in the air
    var still = [];
    for (var q = 0; q < flying.length; q++) {
      var fl = flying[q];
      var t = (now - fl.t0) / fl.dur;
      if (t >= 1) continue;
      still.push(fl);
      if (t < 0) {
        if (!fl.pop) { drawClump(fl.color, fl.variant, fl.x0, fl.y0, 1, 0); continue; }
        if (now < fl.tp) continue;
        var pk = (now - fl.tp) / (fl.t0 - fl.tp);
        // the pop: a quick white burst, and the popcorn springs out of it
        ctx.beginPath();
        ctx.arc(fl.x0, fl.y0, G.unit * (0.3 + pk * 1.1), 0, Math.PI * 2);
        ctx.strokeStyle = "rgba(255, 250, 235, " + (0.9 * (1 - pk)).toFixed(3) + ")";
        ctx.lineWidth = 3 * (1 - pk) + 0.5;
        ctx.stroke();
        drawClump(fl.color, fl.variant, fl.x0, fl.y0, backOut(Math.min(1, pk * 1.5)), 0);
        continue;
      }
      var e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      var u = 1 - e;
      var bx = u * u * fl.x0 + 2 * u * e * fl.cx + e * e * fl.x1;
      var by = u * u * fl.y0 + 2 * u * e * fl.cy + e * e * fl.y1;
      drawClump(fl.color, fl.variant, bx, by, 1, (fl.spin || 0) * (1 - e));
    }
    var landed = flying.length && !still.length;
    flying = still;
    if (landed) {
      if (intro) { intro = false; setStatus(HINT); }
      else afterMove();
    }
  }

  var running = false;
  function kick() {
    if (running) return;
    running = true;
    requestAnimationFrame(tick);
  }
  function tick(now) {
    draw(now);
    if (flying.length || shake) requestAnimationFrame(tick);
    else { running = false; draw(now); }
  }

  // ---------- moves ----------
  function pour(from, to) {
    var a = tubes[from], b = tubes[to];
    if (!canPour(a, b)) return false;
    history.push({ tubes: clone(tubes), moves: moves, extraUsed: extraUsed });
    var n = Math.min(topRun(a), CAP - b.length);
    var now = performance.now();
    var pa = G.pos[from], pb = G.pos[to];
    for (var k = 0; k < n; k++) {
      var fromSlot = a.length - 1, toSlot = b.length;
      var color = a.pop();
      b.push(color);
      if (!reduceMotion) {
        flying.push({
          color: color, variant: to * 3 + toSlot, to: to, toSlot: toSlot,
          x0: pa.cx, y0: slotY(from, fromSlot),
          x1: pb.cx, y1: slotY(to, toSlot),
          cx: (pa.cx + pb.cx) / 2, cy: Math.min(pa.y, pb.y) - 46,
          t0: now + k * 80, dur: 330, spin: (pb.cx > pa.cx ? 1 : -1) * 2.5
        });
      }
    }
    moves++;
    updateHud();
    if (reduceMotion) afterMove();
    return true;
  }

  function afterMove() {
    if (allDone(tubes)) {
      won = true;
      var finished = level;
      level++;
      saveLevel();
      btnUndo.disabled = true;
      btnAdd.disabled = true;
      setStatus("Every color is in its own cup.");
      if (finished % UNLOCK_EVERY === 0) { showUnlock(); return; }
      elWinText.textContent = "Level " + finished + " took you " + moves + (moves === 1 ? " move." : " moves.");
      elWin.hidden = false;
      btnNext.focus();
      return;
    }
    var last = history.length ? lastFinished() : null;
    if (last !== null) setStatus(COLORS[last].name + " is sorted. Nice.");
    else if (!hasMoves()) setStatus(extraUsed ? "No moves left. Try Undo or Restart." : "No moves left. Try Undo or Add cup.");
    else setStatus("Keep going. Match the top colors.");
  }

  function lastFinished() {
    var prev = history[history.length - 1].tubes;
    for (var i = 0; i < tubes.length; i++) {
      if (isComplete(tubes[i]) && !(prev[i] && isComplete(prev[i]))) return tubes[i][0];
    }
    return null;
  }

  function tap(i) {
    if (won || flying.length) return;
    if (i < 0 || i >= tubes.length) { sel = -1; kick(); return; }
    if (sel === -1) {
      if (tubes[i].length && !isComplete(tubes[i])) sel = i;
      else if (isComplete(tubes[i])) setStatus("That cup's done. Pick another one.");
    } else if (sel === i) {
      sel = -1;
    } else {
      var from = sel;
      sel = -1;
      if (!pour(from, i)) {
        shake = { tube: i, t0: performance.now() };
        if (tubes[i].length >= CAP) setStatus("That cup's full.");
        else setStatus("The top colors have to match.");
        if (tubes[i].length && !isComplete(tubes[i])) sel = i;
      }
    }
    kick();
  }

  function hit(px, py) {
    for (var i = 0; i < G.pos.length; i++) {
      var p = G.pos[i];
      var padX = G.tw * 0.25;
      if (px >= p.x - padX && px <= p.x + G.tw + padX && py >= p.y - 30 && py <= p.y + G.th + 18) return i;
    }
    return -1;
  }

  canvas.addEventListener("pointerdown", function (ev) {
    var r = canvas.getBoundingClientRect();
    tap(hit(ev.clientX - r.left, ev.clientY - r.top));
  });

  document.addEventListener("keydown", function (ev) {
    if (!elUnlock.hidden) return;
    if (ev.target && ev.target.tagName === "BUTTON") return;
    if (ev.key >= "0" && ev.key <= "9") {
      var n = ev.key === "0" ? 9 : parseInt(ev.key, 10) - 1;
      if (n < tubes.length) tap(n);
    }
  });

  btnUndo.addEventListener("click", function () {
    if (!history.length || won || flying.length) return;
    var h = history.pop();
    tubes = h.tubes;
    moves = h.moves;
    extraUsed = h.extraUsed;
    sel = -1;
    setStatus("Took that one back.");
    updateHud();
    layout();
    kick();
  });
  btnRestart.addEventListener("click", function () { if (!won) newGame(false); });
  btnNew.addEventListener("click", function () { if (!won) newGame(true); });
  btnAdd.addEventListener("click", function () {
    if (extraUsed || won || flying.length) return;
    history.push({ tubes: clone(tubes), moves: moves, extraUsed: extraUsed });
    tubes.push([]);
    extraUsed = true;
    sel = -1;
    setStatus("One extra cup. You get one per level.");
    updateHud();
    layout();
    kick();
  });
  btnNext.addEventListener("click", function () { newGame(true); });

  // ---------- new flavor reveal ----------
  var bits = [];        // flavor popcorn flying around the screen
  var bitSprites = [];
  var fxRunning = false;
  var fxLast = 0;
  var unlockIdx = -1;
  var revealed = false;

  function showUnlock() {
    unlockIdx = flavorForLevel(level);
    revealed = false;
    bits = [];
    loadFlavor(unlockIdx);
    elStage1.hidden = false;
    elStage2.hidden = true;
    elUnlock.classList.remove("revealed");
    elUnlock.hidden = false;
    elWin.hidden = true;
  }

  function reveal() {
    if (revealed || unlockIdx < 0) return;
    revealed = true;
    var f = FLAVORS[unlockIdx];
    elUName.textContent = f.name;
    btnPlay.textContent = "Play level " + level;
    elStage1.hidden = true;
    elStage2.hidden = false;
    elUnlock.classList.add("revealed");
    applyFlavor(unlockIdx);
    btnPlay.focus();
    if (reduceMotion) return;
    loadFlavor(unlockIdx).then(function (r) {
      if (elUnlock.hidden) return;
      var px = 54 * Math.min(window.devicePixelRatio || 1, 2);
      bitSprites = [];
      for (var k = 0; k < f.c.length; k++) bitSprites.push(makeKernel(r.tx, f, f.c[k], px, unlockIdx * 31 + k * 13 + 1));
      burst();
    });
  }

  function burst() {
    var vw = window.innerWidth, vh = window.innerHeight;
    bits = [];
    for (var i = 0; i < 46; i++) {
      var ang = Math.random() * Math.PI * 2;
      var sp = 170 + Math.random() * 420;
      bits.push({
        x: vw / 2, y: vh / 2,
        vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
        rot: Math.random() * 6.3, vr: (Math.random() - 0.5) * 7,
        size: 34 + Math.random() * 30,
        sprite: i % bitSprites.length,
        born: performance.now() + i * 22
      });
    }
    if (!fxRunning) { fxRunning = true; fxLast = performance.now(); requestAnimationFrame(fxTick); }
  }

  function fxTick(now) {
    if (elUnlock.hidden || !bits.length) { fxRunning = false; return; }
    var vw = window.innerWidth, vh = window.innerHeight;
    var d = Math.min(window.devicePixelRatio || 1, 2);
    if (fx.width !== Math.round(vw * d) || fx.height !== Math.round(vh * d)) {
      fx.width = Math.round(vw * d);
      fx.height = Math.round(vh * d);
    }
    var c = fx.getContext("2d");
    c.setTransform(d, 0, 0, d, 0, 0);
    c.clearRect(0, 0, vw, vh);
    var dt = Math.min(0.05, (now - fxLast) / 1000);
    fxLast = now;
    for (var i = 0; i < bits.length; i++) {
      var b = bits[i];
      if (now < b.born) continue;
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.rot += b.vr * dt;
      var half = b.size / 2;
      if (b.x < half) { b.x = half; b.vx = Math.abs(b.vx); }
      if (b.x > vw - half) { b.x = vw - half; b.vx = -Math.abs(b.vx); }
      if (b.y < half) { b.y = half; b.vy = Math.abs(b.vy); }
      if (b.y > vh - half) { b.y = vh - half; b.vy = -Math.abs(b.vy); }
      var age = Math.min(1, (now - b.born) / 260);
      var sc = backOut(age);
      c.save();
      c.translate(b.x, b.y);
      c.rotate(b.rot);
      c.scale(sc, sc);
      c.shadowColor = "rgba(0,0,0,0.55)";
      c.shadowBlur = 8;
      c.shadowOffsetY = 3;
      c.drawImage(bitSprites[b.sprite], -half, -half, b.size, b.size);
      c.restore();
    }
    requestAnimationFrame(fxTick);
  }

  elUnlock.addEventListener("click", function () { if (!revealed) reveal(); });
  btnPlay.addEventListener("click", function (ev) {
    ev.stopPropagation();
    elUnlock.hidden = true;
    bits = [];
    newGame(true);
  });

  // For testing: tap the title five times fast, or open the page with #unlock, to jump to the next flavor.
  function skipToUnlock() {
    if (!elUnlock.hidden) return;
    var finished = Math.ceil(level / UNLOCK_EVERY) * UNLOCK_EVERY;
    level = finished + 1;
    saveLevel();
    won = true;
    flying = [];
    intro = false;
    sel = -1;
    updateHud();
    kick();
    showUnlock();
  }
  var titleTaps = [];
  document.getElementById("title").addEventListener("click", function () {
    var now = Date.now();
    titleTaps = titleTaps.filter(function (t) { return now - t < 2500; });
    titleTaps.push(now);
    if (titleTaps.length >= 5) { titleTaps = []; skipToUnlock(); }
  });

  if (window.ResizeObserver) {
    new ResizeObserver(function () { if (tubes.length) { layout(); kick(); } }).observe(stage);
  } else {
    window.addEventListener("resize", function () { if (tubes.length) { layout(); kick(); } });
  }

  // ---------- start ----------
  updateHud();
  var cur = flavorForLevel(level);
  if (cur >= 0) applyFlavor(cur);
  Promise.all(COLORS.map(function (c) { return loadImg(c.tx); })).then(function (imgs) {
    colorImgs = imgs;
    newGame(true);
    if (location.hash === "#unlock") skipToUnlock();
  });
})();
</script>
</body>
</html>
